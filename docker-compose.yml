services:
  postgres:
    image: postgres:16-alpine
    container_name: hireflow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hireflow_ai
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hireflow-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: hireflow-ai-service
    restart: always
    ports:
      - '8000:8000'
    environment:
      - PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireflow-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-service:
        condition: service_started
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hireflow_ai?schema=public
      - JWT_SECRET=super-secret-hireflow-key-change-in-prod-2026
      - PORT=3000
      - AI_SERVICE_URL=http://ai-service:8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hireflow-frontend
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - '3001:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api

volumes:
  pgdata:
  redisdata:
